# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Chang Liu"
lab_name: "WISE Lab"
title: "Lecturer, Department of Computer Science and Information Technology"
institution: "La Trobe University, Melbourne, Australia"
email: c.liu6@latrobe.edu.au
photo: headshot.jpg

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://scholar.google.com.au/citations?user=bcaxipEAAAAJ&hl=en"
  github: ""
  researchgate: ""
  orcid: ""
  twitter: ""
  linkedin: ""
  cv: ""

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#1a5f8a"      # theme color for links and buttons
dark_mode: true              # show dark mode toggle in navbar
description: "WISE Lab — Wireless Intelligence and Sensing Engineering, La Trobe University"
baseurl: "/wise-lab-ltu"   # your repo name — change if different
url: "https://nminhquang380.github.io"

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about
  - name: publications
  - name: research
  - name: team
  - name: teaching

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Liu
  first_name: [Chang]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
